
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Preach Mate</title>
<style>
:root{
  --bg:#111827;
  --panel:#1f2937;
  --panel2:#273449;
  --text:#f9fafb;
  --muted:#9ca3af;
  --gold:#d6a52d;
  --line:#374151;
  --input:#151e2e;
  --yellow:#ffeb3b;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text);
font-family:Arial,Helvetica,sans-serif}
body{overflow:hidden}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
#app{height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:60px;min-height:60px;display:flex;align-items:center;gap:12px;
padding:0 14px;background:#111827;border-bottom:1px solid var(--line)}
.icon-btn{width:40px;height:40px;flex-shrink:0;border:0;border-radius:10px;
background:var(--panel2);color:white;font-size:20px}
.brand-wrap{display:flex;align-items:center;gap:9px;min-width:0;flex:1}
.brand{font-size:18px;font-weight:800;color:#e6b944;letter-spacing:.2px}
.brand small{display:block;font-size:10px;font-weight:400;font-style:italic;
letter-spacing:1.2px;color:var(--muted);margin-top:3px}
.brand-logo{width:38px;height:38px;object-fit:contain;border-radius:8px;
border:1px solid #4b5563;background:#fff;flex-shrink:0;cursor:pointer}
.top-actions{display:flex;gap:6px}
.search-wrap{padding:10px 12px 5px}
.search-wrap input{width:100%;padding:12px;border:1px solid var(--line);
border-radius:11px;background:var(--input);color:white;outline:none}
.categories{display:flex;gap:8px;overflow-x:auto;white-space:nowrap;padding:9px 12px;
scrollbar-width:thin;min-height:50px}
.cat{border:1px solid var(--line);border-radius:20px;padding:9px 14px;
background:var(--panel);color:#d1d5db;flex-shrink:0}
.cat.active{background:#8f6b17;color:white;border-color:#d6a52d}
.content{flex:1;overflow-y:auto;padding:8px 12px 100px}
.section-label{color:var(--muted);font-size:12px;margin:8px 3px 12px}
.note-card{border:1px solid var(--line);background:var(--panel);border-radius:13px;
padding:14px;margin-bottom:10px}
.note-card:active{background:var(--panel2)}
.note-heading{display:flex;align-items:flex-start;gap:8px}
.note-title{font-weight:700;font-size:16px;flex:1;overflow-wrap:anywhere}
.note-date{font-size:10px;color:var(--muted);margin-top:6px}
.note-preview{font-size:13px;line-height:1.5;color:#d1d5db;white-space:pre-wrap;
overflow-wrap:anywhere;margin-top:9px;max-height:65px;overflow:hidden}
.note-tools{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.small-btn{background:#374151;color:#e5e7eb;border:0;border-radius:8px;
padding:7px 10px;font-size:12px}
.small-btn.active{color:#ffdf69}
.empty{text-align:center;color:var(--muted);padding:45px 18px;line-height:1.7}
.fab{position:fixed;bottom:22px;right:18px;width:58px;height:58px;border:0;
border-radius:50%;background:#d6a52d;color:#111827;font-size:30px;
box-shadow:0 5px 18px #0006;z-index:5}
.drawer-shade{position:fixed;inset:0;background:#0009;z-index:20}
.drawer{position:fixed;left:0;top:0;bottom:0;width:min(310px,86vw);
background:#182233;z-index:21;padding:18px 14px;overflow-y:auto;
box-shadow:5px 0 25px #0006}
.drawer-brand-row{display:flex;align-items:center;justify-content:space-between;
gap:10px;padding:10px 4px 22px;border-bottom:1px solid var(--line);margin-bottom:12px}
.drawer-title{font-size:21px;font-weight:800;color:#e6b944;min-width:0}
.drawer-item{width:100%;padding:13px 12px;text-align:left;color:#e5e7eb;
border:0;border-radius:9px;background:transparent;margin:2px 0}
.drawer-item:active,.drawer-item:hover{background:#29364a}
.drawer-divider{height:1px;background:var(--line);margin:10px 0}
.editor{position:fixed;inset:0;background:var(--bg);z-index:10;display:flex;flex-direction:column}
.editor-header{min-height:55px;display:flex;align-items:center;gap:7px;padding:8px 10px;
border-bottom:1px solid var(--line);overflow-x:auto}
.editor-header .icon-btn{width:37px;height:37px}
.mode-label{font-size:11px;color:var(--muted);white-space:nowrap}
.save-status{font-size:10px;color:#9ca3af;white-space:nowrap}
.editor-title{width:100%;background:transparent;border:0;border-bottom:1px solid var(--line);
color:white;font-size:22px;font-weight:700;padding:15px 14px;outline:none}
.editor-meta{display:flex;gap:8px;padding:8px 12px;align-items:center}
.editor-meta select{background:var(--panel);color:white;border:1px solid var(--line);
border-radius:8px;padding:8px;max-width:65%}
.editor-date{font-size:11px;color:var(--muted)}
.toolbar{display:flex;gap:6px;align-items:center;overflow-x:auto;padding:8px 10px;
border-top:1px solid var(--line);border-bottom:1px solid var(--line);flex-shrink:0}
.toolbar button{min-width:35px;height:35px;border:1px solid var(--line);
border-radius:7px;background:var(--panel);color:white;padding:0 9px}
.toolbar input[type=color]{width:35px;height:35px;border:0;background:transparent;padding:0}
.editor-body{flex:1;overflow:auto;padding:14px}
#noteBody{min-height:100%;outline:none;font-size:18px;line-height:1.65;
white-space:pre-wrap;overflow-wrap:anywhere;color:#f9fafb}
#noteBody[contenteditable="false"]{user-select:text}
#noteBody mark.search-mark{background:#ffdf00;color:#111}
#noteBody .read-marker{background:#8f7910;color:#ffeb3b;font-weight:400;
border-bottom:2px solid #ffe45c}
.editor-footer{display:flex;gap:7px;overflow-x:auto;padding:9px 10px;
border-top:1px solid var(--line)}
.editor-footer button{border:0;border-radius:8px;background:var(--panel2);
color:white;padding:10px 12px;white-space:nowrap}
.toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%);
background:#f9fafb;color:#111827;padding:11px 16px;border-radius:10px;
font-size:13px;z-index:50;max-width:90vw;text-align:center;box-shadow:0 4px 15px #0005}
.dialog-shade{position:fixed;inset:0;background:#000a;z-index:30;display:flex;
align-items:center;justify-content:center;padding:20px}
.dialog{width:100%;max-width:360px;background:var(--panel);border:1px solid var(--line);
border-radius:14px;padding:18px}
.dialog h3{margin:0 0 12px}
.dialog input{width:100%;padding:12px;background:var(--input);border:1px solid var(--line);
border-radius:8px;color:white;margin:6px 0 12px}
.dialog-actions{display:flex;gap:8px;justify-content:flex-end}
.dialog-actions button{border:0;border-radius:8px;padding:10px 13px;
background:#374151;color:white}
.dialog-actions .primary{background:#d6a52d;color:#111827}
@media(max-width:360px){
  .topbar{gap:7px;padding:0 8px}
  .brand{font-size:16px}
  .brand-logo{width:32px;height:32px}
  .editor-header .icon-btn{width:35px}
  .mode-label{font-size:9px}
  .save-status{min-width:38px;max-width:45px;font-size:8px;padding-left:1px;padding-right:1px}
}
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <button class="icon-btn" id="menuBtn" aria-label="Open menu">☰</button>
    <div class="brand-wrap">
      <div class="brand">Preach Mate<small>bypaulm</small></div>
      <img id="topbarLogo" class="brand-logo hidden" alt="Preach Mate logo" title="Change logo">
    </div>
    <div class="top-actions">
      <button class="icon-btn" id="searchBtn" title="Search">⌕</button>
      <button class="icon-btn" id="newBtn" title="New note">＋</button>
    </div>
  </header>

  <div class="search-wrap hidden" id="searchWrap">
    <input id="searchInput" type="search" placeholder="Search notes and content…">
  </div>
  <nav class="categories" id="categories"></nav>
  <main class="content" id="notesList"></main>
  <button class="fab" id="fab" aria-label="Add note">＋</button>
</div>

<div class="drawer-shade hidden" id="drawerShade"></div>
<aside class="drawer hidden" id="drawer">
  <div class="drawer-brand-row">
    <div class="drawer-title">Preach Mate
      <small style="display:block;font-size:10px;font-weight:300;font-style:italic;letter-spacing:1.2px;color:#9ca3af;margin-top:3px">bypaulm</small>
    </div>
    <img id="drawerLogo" class="brand-logo hidden" alt="Preach Mate logo" title="Change logo">
  </div>
  <button class="drawer-item" id="drawerLogoUpload">▧ &nbsp; Upload / Change Logo</button>
  <button class="drawer-item" id="allNotesBtn">▤ &nbsp; All Notes</button>
  <button class="drawer-item" id="favoritesBtn">★ &nbsp; Favorites</button>
  <button class="drawer-item" id="addCategoryBtn">＋ &nbsp; Add Category</button>
  <button class="drawer-item" id="drawerNewBtn">✎ &nbsp; New Note</button>
  <div class="drawer-divider"></div>
  <button class="drawer-item" id="exportBtn">⇩ &nbsp; Export Backup</button>
  <button class="drawer-item" id="importBtn">⇧ &nbsp; Restore Backup</button>
  <button class="drawer-item" id="removeLogoBtn">× &nbsp; Remove Logo</button>
  <div class="drawer-divider"></div>
  <div style="color:#9ca3af;font-size:11px;padding:8px 12px">Preach Mate by:paulm</div>
</aside>

<div class="editor hidden" id="editor">
  <div class="editor-header">
    <button class="icon-btn" id="backBtn" title="Back">‹</button>
    <span class="mode-label" id="modeLabel">EDIT MODE</span>
    <span class="save-status" id="saveStatus">Saved</span>
    <button class="icon-btn" id="readToggle" title="Read / Edit">◉</button>
    <button class="icon-btn" id="pinBtn" title="Pin note">⌑</button>
    <button class="icon-btn" id="favoriteBtn" title="Favorite">☆</button>
    <button class="icon-btn" id="copyBtn" title="Copy note">▢</button>
  </div>
  <input class="editor-title" id="noteTitle" placeholder="Note title…" maxlength="200">
  <div class="editor-meta">
    <select id="noteCategory" aria-label="Note category"></select>
    <span class="editor-date" id="noteDate"></span>
  </div>
  <div class="toolbar" id="toolbar">
    <button data-cmd="bold" title="Bold"><b>B</b></button>
    <button data-cmd="italic" title="Italic"><i>I</i></button>
    <button data-cmd="underline" title="Underline"><u>U</u></button>
    <button data-cmd="insertUnorderedList" title="Bullets">☷</button>
    <button data-cmd="insertOrderedList" title="Numbered list">1.</button>
    <button id="textColorBtn" title="Text color">A</button>
    <input type="color" id="textColor" value="#f9fafb" title="Choose text color">
    <button id="fontSizeBtn" title="Change text size">Aa</button>
    <button id="markerBtn" title="Mark reading position">▰</button>
    <button id="clearFormatBtn" title="Clear formatting">Tx</button>
  </div>
  <div class="editor-body">
    <div id="noteBody" contenteditable="true" spellcheck="true" data-placeholder="Write your sermon notes here…"></div>
  </div>
  <div class="editor-footer">
    <button id="saveBtn">✓ Save</button>
    <button id="editToggleBtn">Read / Edit</button>
    <button id="copyFooterBtn">Copy</button>
    <button id="deleteBtn">Delete</button>
  </div>
</div>

<div class="dialog-shade hidden" id="dialogShade">
  <div class="dialog">
    <h3 id="dialogTitle">Add category</h3>
    <input id="dialogInput" placeholder="Enter name">
    <div class="dialog-actions">
      <button id="dialogCancel">Cancel</button>
      <button class="primary" id="dialogOK">Save</button>
    </div>
  </div>
</div>

<div class="hidden">
  <input type="file" id="logoFileInput" accept="image/*">
  <input type="file" id="backupFileInput" accept=".json,application/json">
</div>
<div class="toast hidden" id="toast"></div>

<script>
(() => {
"use strict";

const $ = id => document.getElementById(id);
const NOTES_KEY = "notepal_notes_v2";
const CATS_KEY = "notepal_categories_v2";
const LOGO_KEY = "preach_mate_logo_v1";
const MAX_LOGO_BYTES = 21 * 1024;

const DEFAULT_CATEGORIES = ["All Notes","Personal","Study","Work","Ideas"];
let notes = [];
let categories = [...DEFAULT_CATEGORIES];
let activeCategory = "All Notes";
let favoritesOnly = false;
let currentNoteId = null;
let isReadMode = false;
let toastTimer = null;
let dialogAction = null;
let lastEditorState = null;
let searchTerm = "";

function uid(){
  return Date.now().toString(36) + Math.random().toString(36).slice(2,9);
}
function dateNow(){
  return new Date().toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"});
}
function escapeHTML(s){
  return String(s ?? "").replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}
function showToast(message){
  $("toast").textContent = message;
  $("toast").classList.remove("hidden");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>$("toast").classList.add("hidden"),2400);
}
function loadData(){
  try{
    const saved = JSON.parse(localStorage.getItem(NOTES_KEY) || "[]");
    if(Array.isArray(saved)) notes = saved;
  }catch(e){notes=[]}
  try{
    const savedCats = JSON.parse(localStorage.getItem(CATS_KEY) || "null");
    if(Array.isArray(savedCats) && savedCats.length) categories = savedCats;
  }catch(e){}
  if(!categories.includes("All Notes")) categories.unshift("All Notes");
  notes = notes.map(n=>({
    id:n.id || uid(),
    title:n.title || "",
    body:n.body || "",
    category:n.category || "Personal",
    createdAt:n.createdAt || dateNow(),
    updatedAt:n.updatedAt || dateNow(),
    favorite:!!n.favorite,
    pinned:!!n.pinned
  }));
}
function persist(){
  try{
    localStorage.setItem(NOTES_KEY,JSON.stringify(notes));
    localStorage.setItem(CATS_KEY,JSON.stringify(categories));
    $("saveStatus").textContent = "Saved";
  }catch(e){
    $("saveStatus").textContent = "Storage full";
    showToast("Could not save. Device storage may be full.");
  }
}
function getCurrentNote(){
  return notes.find(n=>n.id===currentNoteId) || null;
}
function plainText(html){
  const d=document.createElement("div");
  d.innerHTML=html || "";
  return d.innerText || d.textContent || "";
}
function renderCategories(){
  const nav=$("categories");
  nav.innerHTML="";
  categories.forEach(cat=>{
    const b=document.createElement("button");
    b.className="cat"+(cat===activeCategory?" active":"");
    b.textContent=cat;
    b.addEventListener("click",()=>{
      activeCategory=cat;
      favoritesOnly=false;
      renderCategories();
      renderNotes();
    });
    nav.appendChild(b);
  });
}
function renderNotes(){
  const list=$("notesList");
  list.innerHTML="";
  let shown=notes.filter(n=>{
    if(favoritesOnly && !n.favorite) return false;
    if(activeCategory!=="All Notes" && n.category!==activeCategory) return false;
    if(searchTerm){
      const hay=(n.title+" "+plainText(n.body)+" "+n.category).toLowerCase();
      if(!hay.includes(searchTerm.toLowerCase())) return false;
    }
    return true;
  });
  shown.sort((a,b)=>(Number(b.pinned)-Number(a.pinned)) ||
    ((b.updatedAt||"").localeCompare(a.updatedAt||"")));
  const label=document.createElement("div");
  label.className="section-label";
  label.textContent=favoritesOnly?"FAVORITES":activeCategory.toUpperCase();
  list.appendChild(label);
  if(!shown.length){
    const empty=document.createElement("div");
    empty.className="empty";
    empty.innerHTML="No notes here yet.<br>Tap the + button to create your first note.";
    list.appendChild(empty);
    return;
  }
  shown.forEach(n=>{
    const card=document.createElement("article");
    card.className="note-card";
    const heading=document.createElement("div");
    heading.className="note-heading";
    const title=document.createElement("div");
    title.className="note-title";
    title.textContent=(n.pinned?"📌 ":"")+(n.title||"Untitled Note");
    heading.appendChild(title);
    const star=document.createElement("button");
    star.className="small-btn"+(n.favorite?" active":"");
    star.textContent=n.favorite?"★":"☆";
    star.title="Toggle favorite";
    star.addEventListener("click",e=>{
      e.stopPropagation();n.favorite=!n.favorite;persist();renderNotes();
    });
    heading.appendChild(star);
    card.appendChild(heading);
    const date=document.createElement("div");
    date.className="note-date";
    date.textContent=(n.category||"Personal")+" · "+(n.updatedAt||n.createdAt);
    card.appendChild(date);
    const preview=document.createElement("div");
    preview.className="note-preview";
    preview.textContent=plainText(n.body).slice(0,260)||"No content yet.";
    card.appendChild(preview);
    const tools=document.createElement("div");
    tools.className="note-tools";
    const open=document.createElement("button");
    open.className="small-btn";open.textContent="Open";
    open.addEventListener("click",()=>openNote(n.id,false));
    const copy=document.createElement("button");
    copy.className="small-btn";copy.textContent="Copy";
    copy.addEventListener("click",()=>copyNote(n));
    const pin=document.createElement("button");
    pin.className="small-btn";pin.textContent=n.pinned?"Unpin":"Pin";
    pin.addEventListener("click",()=>{
      n.pinned=!n.pinned;persist();renderNotes();
      showToast(n.pinned?"Note pinned":"Note unpinned");
    });
    tools.append(open,copy,pin);card.appendChild(tools);
    card.addEventListener("click",e=>{
      if(!e.target.closest("button")) openNote(n.id,false);
    });
    list.appendChild(card);
  });
}
function renderCategorySelect(){
  const sel=$("noteCategory");
  sel.innerHTML="";
  categories.filter(c=>c!=="All Notes").forEach(cat=>{
    const o=document.createElement("option");
    o.value=cat;o.textContent=cat;sel.appendChild(o);
  });
}
function createNote(){
  const n={id:uid(),title:"",body:"",category:
    (activeCategory!=="All Notes" && categories.includes(activeCategory))?activeCategory:"Personal",
    createdAt:dateNow(),updatedAt:dateNow(),favorite:false,pinned:false};
  if(!categories.includes(n.category)) categories.push(n.category);
  notes.unshift(n);
  persist();
  openNote(n.id,true);
}
function openNote(id,editing){
  currentNoteId=id;
  const n=getCurrentNote();
  if(!n)return;
  isReadMode=!editing;
  $("noteTitle").value=n.title;
  $("noteBody").innerHTML=n.body;
  $("noteCategory").value=n.category;
  $("noteDate").textContent="Updated "+n.updatedAt;
  updateEditorMode();
  $("editor").classList.remove("hidden");
  $("fab").classList.add("hidden");
  $("noteBody").scrollTop=0;
  lastEditorState=null;
}
function updateEditorMode(){
  $("modeLabel").textContent=isReadMode?"READ MODE":"EDIT MODE";
  $("noteTitle").readOnly=isReadMode;
  $("noteCategory").disabled=isReadMode;
  $("noteBody").contentEditable=String(!isReadMode);
  $("toolbar").classList.toggle("hidden",isReadMode);
  $("saveBtn").classList.toggle("hidden",isReadMode);
  $("deleteBtn").classList.toggle("hidden",isReadMode);
  $("editToggleBtn").textContent=isReadMode?"Edit Note":"Read Mode";
  $("readToggle").textContent=isReadMode?"✎":"◉";
  const n=getCurrentNote();
  $("favoriteBtn").textContent=n&&n.favorite?"★":"☆";
  $("pinBtn").textContent=n&&n.pinned?"📌":"⌑";
}
function saveCurrentNote(){
  const n=getCurrentNote();
  if(!n)return;
  n.title=$("noteTitle").value.trim();
  n.body=$("noteBody").innerHTML;
  n.category=$("noteCategory").value||"Personal";
  n.updatedAt=dateNow();
  if(!categories.includes(n.category)) categories.push(n.category);
  persist();
  renderCategories();renderNotes();
  $("noteDate").textContent="Updated "+n.updatedAt;
}
function closeEditor(){
  if(!isReadMode) saveCurrentNote();
  $("editor").classList.add("hidden");
  $("fab").classList.remove("hidden");
  currentNoteId=null;
  renderNotes();
}
function toggleReadMode(){
  if(!isReadMode) saveCurrentNote();
  isReadMode=!isReadMode;
  updateEditorMode();
}
function copyNote(n){
  const text=(n.title?n.title+"\n\n":"")+plainText(n.body);
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>showToast("Note copied!"))
      .catch(()=>fallbackCopy(text));
  }else fallbackCopy(text);
}
function fallbackCopy(text){
  const ta=document.createElement("textarea");
  ta.value=text;document.body.appendChild(ta);ta.select();
  try{document.execCommand("copy");showToast("Note copied!")}
  catch(e){showToast("Unable to copy note.")}
  ta.remove();
}
function toggleFavorite(){
  const n=getCurrentNote();if(!n)return;
  n.favorite=!n.favorite;persist();updateEditorMode();renderNotes();
  showToast(n.favorite?"Added to favorites":"Removed from favorites");
}
function togglePin(){
  const n=getCurrentNote();if(!n)return;
  n.pinned=!n.pinned;persist();updateEditorMode();renderNotes();
  showToast(n.pinned?"Note pinned":"Note unpinned");
}
function deleteCurrentNote(){
  const n=getCurrentNote();if(!n)return;
  showDialog("Delete note","Delete “"+(n.title||"Untitled Note")+"”?",()=>{
    notes=notes.filter(x=>x.id!==currentNoteId);
    persist();$("editor").classList.add("hidden");
    $("fab").classList.remove("hidden");currentNoteId=null;renderNotes();
    showToast("Note deleted");
  },true);
}
function openDrawer(){
  $("drawer").classList.remove("hidden");
  $("drawerShade").classList.remove("hidden");
}
function closeDrawer(){
  $("drawer").classList.add("hidden");
  $("drawerShade").classList.add("hidden");
}
function showDialog(title,placeholder,onOK,confirmOnly=false){
  $("dialogTitle").textContent=title;
  $("dialogInput").value="";
  $("dialogInput").placeholder=confirmOnly?"":placeholder;
  $("dialogInput").classList.toggle("hidden",confirmOnly);
  $("dialogShade").classList.remove("hidden");
  dialogAction=onOK;
}
function closeDialog(){
  $("dialogShade").classList.add("hidden");
  $("dialogInput").classList.remove("hidden");
  dialogAction=null;
}
function exportBackup(){
  const data={app:"Preach Mate",version:1,exportedAt:new Date().toISOString(),
    notes,categories};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;a.download="preach-mate-backup.json";a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  showToast("Backup exported");
}
function importBackup(file){
  if(!file)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const data=JSON.parse(r.result);
      if(!data || !Array.isArray(data.notes)) throw new Error("Invalid");
      showDialog("Restore backup","This replaces the current notes. Continue?",()=>{
        notes=data.notes.map(n=>({...n,id:n.id||uid()}));
        if(Array.isArray(data.categories)) categories=data.categories;
        if(!categories.includes("All Notes"))categories.unshift("All Notes");
        persist();renderCategories();renderCategorySelect();renderNotes();
        closeDialog();showToast("Backup restored");
      },true);
    }catch(e){showToast("Invalid backup file.")}
  };
  r.onerror=()=>showToast("Unable to read backup.");
  r.readAsText(file);
}

/* LOGO: choose image, compress, enforce maximum 21 KB, and save locally */
function applySavedLogo(){
  let data=null;
  try{data=localStorage.getItem(LOGO_KEY)}catch(e){}
  ["topbarLogo","drawerLogo"].forEach(id=>{
    const img=$(id);
    if(data){
      img.src=data;
      img.classList.remove("hidden");
    }else{
      img.removeAttribute("src");
      img.classList.add("hidden");
    }
  });
}
function chooseLogo(){
  $("logoFileInput").value="";
  $("logoFileInput").click();
}
function compressLogo(file){
  if(!file || !file.type.startsWith("image/")){
    showToast("Please select an image.");return;
  }
  const reader=new FileReader();
  reader.onload=()=>{
    const image=new Image();
    image.onload=()=>{
      const maxSide=320;
      const scale=Math.min(1,maxSide/Math.max(image.naturalWidth,image.naturalHeight));
      const canvas=document.createElement("canvas");
      canvas.width=Math.max(1,Math.round(image.naturalWidth*scale));
      canvas.height=Math.max(1,Math.round(image.naturalHeight*scale));
      const ctx=canvas.getContext("2d");
      if(!ctx){showToast("Unable to process this image.");return}
      ctx.drawImage(image,0,0,canvas.width,canvas.height);

      function trySave(quality){
        canvas.toBlob(blob=>{
          if(!blob){showToast("Unable to compress this image.");return}
          if(blob.size>MAX_LOGO_BYTES && quality>0.25){
            trySave(Math.max(0.25,quality-0.15));return;
          }
          if(blob.size>MAX_LOGO_BYTES){
            showToast("Logo is still over 21 KB. Try a simpler or smaller image.");return;
          }
          const rr=new FileReader();
          rr.onload=()=>{
            try{
              localStorage.setItem(LOGO_KEY,rr.result);
              applySavedLogo();
              showToast("Logo saved on this device!");
            }catch(e){
              showToast("Could not save logo. Device storage may be full.");
            }
          };
          rr.onerror=()=>showToast("Unable to save the image.");
          rr.readAsDataURL(blob);
        },"image/webp",quality);
      }
      trySave(0.85);
    };
    image.onerror=()=>showToast("Unable to open this image.");
    image.src=reader.result;
  };
  reader.onerror=()=>showToast("Unable to read this image.");
  reader.readAsDataURL(file);
}

$("copyFooterBtn").addEventListener("click",()=>{const n=getCurrentNote();if(n)copyNote(n)});

$("noteTitle").addEventListener("input",()=>{

  const n=getCurrentNote();if(!n)return;
  n.title=$("noteTitle").value;

});

});

  if(!b || isReadMode)return;

  document.execCommand(b.dataset.cmd,false,null);
  const n=getCurrentNote();if(n){n.body=$("noteBody").innerHTML;persist()}
});
$("textColorBtn").addEventListener("click",()=>$("textColor").click());
$("textColor").addEventListener("input",e=>{
  if(isReadMode)return;
  $("noteBody").focus();
  document.execCommand("styleWithCSS",false,true);
  document.execCommand("foreColor",false,e.target.value);
});
$("fontSizeBtn").addEventListener("click",()=>{
  if(isReadMode)return;
  showDialog("Text size","Enter size from 12 to 40",()=>{
    const size=parseInt($("dialogInput").value,10);
    if(!Number.isFinite(size)||size<12||size>40){showToast("Choose 12–40.");return}
    $("noteBody").focus();
    document.execCommand("styleWithCSS",false,true);
    document.execCommand("fontSize",false,"7");
    $("noteBody").querySelectorAll('font[size="7"]').forEach(el=>{
      el.removeAttribute("size");el.style.fontSize=size+"px";
    });
    const n=getCurrentNote();if(n){n.body=$("noteBody").innerHTML;persist()}
    closeDialog();
  });
});
$("markerBtn").addEventListener("click",()=>{
  if(isReadMode)return;
  const sel=window.getSelection();
  if(!sel || !sel.rangeCount || sel.isCollapsed){
    showToast("Select the text you want to mark first.");return;
  }
  const range=sel.getRangeAt(0);
  if(!$("noteBody").contains(range.commonAncestorContainer)){
    showToast("Select text inside your note.");return;
  }
  const span=document.createElement("span");
  span.className="read-marker";
  try{
    range.surroundContents(span);
  }catch(e){
    showToast("Please select text within the same paragraph.");return;
  }
  const n=getCurrentNote();if(n){n.body=$("noteBody").innerHTML;persist()}
  sel.removeAllRanges();
  showToast("Reading marker added");
});
$("clearFormatBtn").addEventListener("click",()=>{

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Preach Mate</title>
<style>
:root{
  --bg:#f3f4f6;--surface:#fff;--text:#111827;--muted:#6b7280;
  --border:#e5e7eb;--primary:#2563eb;--highlight:#fef08a;
}
*{box-sizing:border-box}
html{width:100%;height:100%;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;width:100%;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
button,input{font:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
input,button,select,textarea{font-size:16px}
.hidden{display:none!important}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.topbar{min-height:58px;background:#fff;display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--border);flex-shrink:0;padding-top:max(8px,env(safe-area-inset-top))}
.brand{font-size:20px;font-weight:800;flex:1}
.icon-btn{border:0;background:transparent;border-radius:10px;width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;font-size:22px;color:var(--text);flex-shrink:0}
.icon-btn:active{background:var(--border)}
.searchbar{padding:9px 12px 5px;background:#fff;flex-shrink:0}
.searchbar input{width:100%;border:1px solid var(--border);background:var(--bg);padding:11px 13px;border-radius:12px;outline:none}
.category-row{display:flex;align-items:center;gap:7px;overflow-x:auto;white-space:nowrap;padding:10px 12px;background:#fff;scrollbar-width:none;flex-shrink:0;touch-action:pan-x}
.category-row::-webkit-scrollbar{display:none}
.category-tab{border:1px solid var(--border);border-radius:22px;padding:8px 13px;background:#fff;color:#374151;font-size:13px;flex-shrink:0;user-select:none;-webkit-user-select:none}
.category-tab.active{background:var(--primary);border-color:var(--primary);color:#fff}
.category-tab.dragging,.drawer-category.dragging{opacity:.4;border:2px dashed var(--primary)}
.category-tab.drag-target,.drawer-category.drag-target{outline:2px solid var(--primary);outline-offset:2px}
.add-category{width:37px;height:37px;flex-shrink:0;border:1px dashed #9ca3af;border-radius:50%;background:#fff;color:#374151;font-size:18px}
.home-content{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 12px calc(90px + env(safe-area-inset-bottom))}
.section-heading{font-size:13px;color:var(--muted);margin:3px 3px 12px}
.notes-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.note-card{height:210px;min-height:210px;min-width:0;background:#fff;border:1px solid var(--border);border-radius:15px;padding:13px;box-shadow:0 3px 12px #0000000b;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:8px}
.note-card.pinned{border-color:#93c5fd}
.note-card-title{font-weight:750;font-size:15px;overflow-wrap:anywhere;padding-right:48px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;flex-shrink:0}
.note-card-preview{font-size:13px;line-height:1.45;color:#4b5563;overflow-wrap:anywhere;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;flex-shrink:0}
.search-match{background:#fde047;color:#111827;border-radius:3px;padding:0 2px;font-weight:800;box-shadow:0 0 0 1px #eab30840;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.note-card-meta{margin-top:auto;padding-top:5px;display:flex;gap:6px;align-items:center;color:var(--muted);font-size:11px;min-width:0}
.note-card-meta span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note-fav{position:absolute;top:10px;right:10px;font-size:15px;color:#d97706;pointer-events:none}
.note-pin{position:absolute;top:5px;right:32px;width:30px;height:30px;border:0;border-radius:8px;background:transparent;color:#9ca3af;display:flex;align-items:center;justify-content:center;font-size:17px;padding:0;z-index:2}
.note-pin:active{background:#dbeafe}
.note-pin.is-pinned{color:#2563eb;background:#dbeafe}
.note-pin:focus-visible{outline:2px solid var(--primary);outline-offset:1px}
.empty-state{text-align:center;color:var(--muted);padding:50px 20px;line-height:1.6}
.fab{position:fixed;right:21px;right:max(21px,env(safe-area-inset-right));bottom:22px;bottom:max(22px,env(safe-area-inset-bottom));width:58px;height:58px;border:0;border-radius:50%;background:var(--primary);color:#fff;font-size:32px;box-shadow:0 6px 18px #0003;z-index:20}
.drawer-backdrop,.dialog-backdrop{position:fixed;inset:0;background:#0006;z-index:50}
.drawer{position:absolute;left:0;top:0;bottom:0;bottom:env(safe-area-inset-bottom);width:min(84vw,330px);background:#fff;padding:16px;padding-top:max(16px,env(safe-area-inset-top));box-shadow:5px 0 24px #0002;display:flex;flex-direction:column;gap:6px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.drawer-title{font-size:21px;font-weight:800;padding:10px 6px 16px}
.drawer-item{border:0;background:transparent;text-align:left;padding:12px;border-radius:10px;font-size:15px}
.drawer-item:active,.drawer-item:hover{background:var(--bg)}
.drawer-section-title{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);padding:14px 10px 5px}
.drawer-categories{display:flex;flex-direction:column;gap:3px}
.drawer-category{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:#fff;padding:11px 10px;border-radius:9px;font-size:14px;user-select:none;-webkit-user-select:none}
.drawer-category.active{background:#dbeafe;color:#1d4ed8;font-weight:700}
.drawer-category .cat-count{margin-left:auto;font-size:11px;color:#6b7280}
.drawer-category .cat-drag-handle{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;width:23px;min-height:27px;margin-left:-5px;border-radius:6px;color:#9ca3af;font-size:21px;line-height:1;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.drawer-category .cat-drag-handle:active{background:#e5e7eb;color:#374151}
.drawer-category .cat-icon{flex-shrink:0}
.drawer-category .cat-name{overflow-wrap:anywhere}
.drawer-footer{margin-top:auto;font-size:12px;color:var(--muted);padding:12px 6px}
.editor-screen{position:fixed;inset:0;background:#fff;z-index:30;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);padding-bottom:0;min-height:0}
.editor-header{display:flex;align-items:center;gap:4px;padding:7px 7px;border-bottom:1px solid var(--border);min-height:54px;flex-shrink:0;background:#fff}
.editor-title{flex:1;min-width:0;width:0;border:0;outline:0;background:transparent;font-size:18px;font-weight:750;padding:9px 5px;color:var(--text)}
.editor-title::placeholder{color:#9ca3af}
.mode-label{font-size:10px;color:var(--muted);padding:0 2px;flex-shrink:0}
.save-status{display:inline-block;flex-shrink:0;min-width:43px;max-width:62px;overflow:hidden;white-space:nowrap;text-overflow:clip;text-align:center;font-size:9px;line-height:1.2;font-weight:600;padding:3px 2px;border-radius:5px}
.save-status.saving{color:#92400e;background:#fef3c7}
.save-status.saved{color:#166534;background:#dcfce7}
.save-status.error{color:#b91c1c;background:#fee2e2}
.note-body{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;outline:0;border:0;padding:18px 20px 120px;font-size:17px;line-height:1.45;overflow-wrap:anywhere;user-select:text;-webkit-user-select:text;box-sizing:border-box;scroll-behavior:auto;overflow-anchor:none}
.note-body:empty:before{content:"Write your note here...";color:#9ca3af;pointer-events:none}
.note-body[contenteditable="false"]{cursor:text}
.note-body p{margin:0 0 8px}
.note-body div{margin-top:0;margin-bottom:0}
.note-body img{max-width:100%;height:auto}
.note-body blockquote{border-left:3px solid #9ca3af;margin:8px 0;padding-left:12px;color:#4b5563}
.note-body ul,.note-body ol{padding-left:25px;margin-top:6px;margin-bottom:8px}

/* READ MODE MARKER: stable inline text, no vibration or layout shifting. */
.read-word-marker{
  display:inline!important;
  position:relative;
  padding:0!important;
  margin:0!important;
  color:#ffeb3b!important;
  background:#8f7910!important;
  border:0!important;
  outline:1px solid #ffe45c;
  outline-offset:0;
  border-radius:1px;
  box-shadow:none!important;
  text-shadow:0 0 1px rgba(255,244,163,.65);
  font-family:inherit!important;
  font-size:inherit!important;
  font-weight:400!important;
  -webkit-text-stroke:0!important;
  line-height:inherit!important;
  -webkit-box-decoration-break:clone;
  box-decoration-break:clone;
  animation:none!important;
  transform:none!important;
  will-change:auto;
}
.read-word-marker::after{content:none!important;display:none!important}

.editor-toolbar{position:fixed;left:0;right:0;bottom:0;min-height:49px;background:#fff;border-top:1px solid var(--border);display:flex;justify-content:space-around;align-items:center;gap:2px;padding:5px 5px calc(5px + env(safe-area-inset-bottom));z-index:45;box-shadow:0 -3px 12px #0000000a}
.fmt-btn{min-width:30px;height:38px;border:1px solid transparent;border-radius:8px;background:transparent;color:#1f2937;display:inline-flex;align-items:center;justify-content:center;font-size:16px;padding:5px 4px;flex:1;max-width:55px}
.fmt-btn:active,.fmt-btn.active{background:#e5e7eb}
#btnHighlight{background:#fef08a;border-color:#eab308}
#btnTextColor{font-size:19px}
.color-palette{position:fixed;left:8px;right:8px;bottom:55px;z-index:47;background:#fff;border:1px solid var(--border);border-radius:14px;box-shadow:0 6px 24px #0002;padding:12px}
.palette-heading{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:10px}
.palette-colors{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:9px}
.color-swatch{width:100%;aspect-ratio:1;border:2px solid #e5e7eb;border-radius:50%;position:relative;min-width:25px}
.color-swatch.selected{outline:2px solid #2563eb;outline-offset:2px}
.color-swatch.selected:after{content:"✓";position:absolute;inset:0;display:grid;place-items:center;color:#111;font-size:15px;font-weight:bold;text-shadow:0 0 3px white}
.palette-close{border:0;background:transparent;font-size:24px;padding:0 8px;min-width:40px;min-height:40px}
.editor-menu{position:absolute;right:8px;top:calc(49px + env(safe-area-inset-top));width:min(215px,calc(100vw - 16px));background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:0 8px 28px #0002;padding:6px;z-index:60}
.menu-item{width:100%;border:0;background:transparent;text-align:left;padding:12px 11px;border-radius:8px;font-size:14px;color:#111827}
.menu-item:active{background:var(--bg)}
.menu-item.danger{color:#dc2626}
.dialog-backdrop{display:flex;align-items:center;justify-content:center;padding:20px;z-index:80;overflow-y:auto}
.dialog{width:min(100%,360px);max-height:calc(100dvh - 40px);overflow-y:auto;background:#fff;border-radius:16px;padding:20px;box-shadow:0 12px 40px #0003}
.dialog h3{margin:0 0 14px;font-size:18px}
.dialog input,.dialog select{width:100%;padding:12px;border:1px solid var(--border);border-radius:9px;margin-bottom:13px;background:#fff}
.dialog-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:6px}
.btn{border:1px solid var(--border);background:#fff;padding:10px 14px;border-radius:9px}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.danger{color:#dc2626}
.toast{position:fixed;bottom:80px;bottom:calc(80px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 15px;border-radius:20px;font-size:13px;z-index:100;box-shadow:0 4px 15px #0003;max-width:90vw;text-align:center}
@media(min-width:650px){
  .notes-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .home-content{padding-left:22px;padding-right:22px}
}
@media(max-width:360px){
  .topbar{gap:4px;padding-left:7px;padding-right:7px}
  .brand{font-size:18px}
  .notes-grid{gap:7px}
  .note-card{padding:10px;height:205px;min-height:205px}
  .note-card-title{font-size:14px}
  .note-card-preview{font-size:12px}
  .editor-header{gap:1px;padding-left:3px;padding-right:3px}
  .editor-header .icon-btn{width:35px}
  .mode-label{font-size:9px}
  .save-status{min-width:38px;max-width:45px;font-size:8px;padding-left:1px;padding-right:1px}
}
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <button class="icon-btn" id="btnDrawer" aria-label="Open menu">☰</button>
    <div class="brand">Preach Mate</div>
    <button class="icon-btn" id="btnFavorites" title="Favorites" aria-label="Favorites">☆</button>
  </header>
  <div class="searchbar"><input id="searchInput" type="search" placeholder="Search notes..." autocomplete="off" aria-label="Search notes"></div>
  <nav class="category-row" id="categoryTabs" aria-label="Categories"></nav>
  <main class="home-content">
    <div class="section-heading" id="notesCount">Your notes</div>
    <div class="notes-grid" id="notesGrid"></div>
    <div class="empty-state hidden" id="emptyState"><div style="font-size:38px;margin-bottom:8px">📝</div><strong>No notes found</strong><div>Create a note using the + button.</div></div>
  </main>
  <button class="fab" id="btnNewNote" aria-label="Create new note">+</button>
</div>

<div class="drawer-backdrop hidden" id="drawerBackdrop">
  <aside class="drawer">
    <div class="drawer-title">Preach Mate <small style="display:block;font-size:12px;font-weight:500;color:#6b7280;margin-top:4px">by:paulm.</small></div>
    <button class="drawer-item" id="drawerHome">⌂ &nbsp; All Notes</button>
    <button class="drawer-item" id="drawerFavorites">☆ &nbsp; Favorites</button>
    <button class="drawer-item" id="drawerNewCategory">⊞ &nbsp; Add Category</button>
    <button class="drawer-item" id="drawerNewNote">＋ &nbsp; New Note</button>
    <div class="drawer-section-title">Your Categories</div>
    <div class="drawer-categories" id="drawerCategories"></div>
    <button class="drawer-item" id="drawerExport">↗ &nbsp; Export Notes</button>
    <div class="drawer-footer">Notes are saved on this device.</div>
  </aside>
</div>

<section class="editor-screen hidden" id="editorScreen">
  <header class="editor-header">
    <button class="icon-btn" id="btnBack" title="Back" aria-label="Back">‹</button>
    <input class="editor-title" id="noteTitle" placeholder="Note title" maxlength="180" aria-label="Note title">
    <span class="mode-label" id="modeLabel">READ</span>
    <span class="save-status saved" id="saveStatus" role="status" aria-live="polite">✓ Saved</span>
    <button class="icon-btn" id="btnCopy" title="Copy note" aria-label="Copy note">▣</button>
    <button class="icon-btn" id="btnMenu" title="More options" aria-label="More options">⋮</button>
  </header>
  <div class="note-body" id="noteBody" contenteditable="false" spellcheck="true"></div>
  <div class="editor-menu hidden" id="editorMenu">
    <button class="menu-item" id="menuMode">Edit Mode</button>
    <button class="menu-item" id="menuMove">↪ Move to Category</button>
    <button class="menu-item" id="menuPin">📌 Pin to Top</button>
    <button class="menu-item" id="menuFavorite">☆ Favorite</button>
    <button class="menu-item danger" id="menuDelete">Delete Note</button>
  </div>
</section>

<div class="editor-toolbar hidden" id="editorToolbar">
  <button class="fmt-btn" id="btnUndo" title="Undo" aria-label="Undo">↶</button>
  <button class="fmt-btn" id="btnRedo" title="Redo" aria-label="Redo">↷</button>
  <button class="fmt-btn" id="btnBold" title="Bold"><b>B</b></button>
  <button class="fmt-btn" id="btnItalic" title="Italic"><i>I</i></button>
  <button class="fmt-btn" id="btnUnderline" title="Underline"><u>U</u></button>
  <button class="fmt-btn" id="btnHighlight" title="Choose highlight color">A</button>
  <button class="fmt-btn" id="btnTextColor" title="Choose font color">◉</button>
  <button class="fmt-btn" id="btnFontMinus" title="Decrease size">−</button>
  <button class="fmt-btn" id="btnFontPlus" title="Increase size">+</button>
</div>

<div class="color-palette hidden" id="colorPalette">
  <div class="palette-heading"><span id="paletteTitle">Choose color</span><button class="palette-close" id="paletteClose" aria-label="Close color palette">×</button></div>
  <div class="palette-colors" id="paletteColors"></div>
</div>

<div class="dialog-backdrop hidden" id="dialogBackdrop">
  <div class="dialog" role="dialog" aria-modal="true">
    <h3 id="dialogTitle">Add Category</h3>
    <div id="dialogContent"></div>
    <div class="dialog-actions">
      <button class="btn" id="dialogCancel">Cancel</button>
      <button class="btn primary" id="dialogConfirm">Save</button>
    </div>
  </div>
</div>
<div class="toast hidden" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
"use strict";
const $ = id => document.getElementById(id);
const STORAGE_KEY = "notepal_notes_v2";
const CATEGORIES_KEY = "notepal_categories_v2";
const COLORS = [
  {name:"Yellow",value:"#fef08a"},
  {name:"Gold",value:"#fde047"},
  {name:"Orange",value:"#fed7aa"},
  {name:"Pink",value:"#fbcfe8"},
  {name:"Red",value:"#fecaca"},
  {name:"Purple",value:"#e9d5ff"},
  {name:"Blue",value:"#bfdbfe"},
  {name:"Sky",value:"#bae6fd"},
  {name:"Green",value:"#bbf7d0"},
  {name:"Mint",value:"#a7f3d0"},
  {name:"White",value:"#ffffff"},
  {name:"Gray",value:"#d1d5db"},
  {name:"Black",value:"#111827"},
  {name:"Dark blue",value:"#1d4ed8"},
  {name:"Dark red",value:"#b91c1c"},
  {name:"Dark green",value:"#047857"},
  {name:"Violet",value:"#7e22ce"},
  {name:"Brown",value:"#92400e"},
  {name:"Slate",value:"#475569"},
  {name:"Teal",value:"#0f766e"},
  {name:"Rose",value:"#e11d48"}
];

function makeId(){return "n_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,8)}
function parseJSON(v,f){try{return JSON.parse(v)??f}catch(e){return f}}
const DEFAULT_CATEGORIES=["All Notes","Personal","Study","Work","Ideas"];
let categories=parseJSON(localStorage.getItem(CATEGORIES_KEY),DEFAULT_CATEGORIES);
if(!Array.isArray(categories)||!categories.length)categories=[...DEFAULT_CATEGORIES];
if(!categories.includes("All Notes"))categories.unshift("All Notes");
categories=["All Notes",...categories.filter(c=>c!=="All Notes")];

let notes=parseJSON(localStorage.getItem(STORAGE_KEY),null);
if(!Array.isArray(notes)){
  notes=[{
    id:makeId(),title:"Welcome to Preach Mate",
    content:"<p>Your notes are saved automatically on this device.</p><p><b>Read Mode:</b> Tap a word to temporarily mark where you stopped reading.</p><p><b>Edit Mode:</b> Select text, then choose highlight or font color from the toolbar.</p>",
    category:"Personal",favorite:false,pinned:false,fontSize:17,color:"#111827",updated:Date.now()
  }];
}
if(Array.isArray(notes)){
  notes.forEach(n=>{if(typeof n.pinned!=="boolean")n.pinned=false});
}

let activeCategory="All Notes",favoritesOnly=false,currentNoteId=null,isEditMode=false;
let dialogAction=null,toastTimer=null,markerSpan=null,savedSelection=null;
let paletteType="highlight";
let dragInfo=null,suppressCategoryClick=false;
let saveStatusTimer=null;

const home=$("app"),editor=$("editorScreen"),noteTitle=$("noteTitle"),noteBody=$("noteBody");
const toolbar=$("editorToolbar"),palette=$("colorPalette"),menu=$("editorMenu");
const vv=window.visualViewport;

function setSaveStatus(state){
  const status=$("saveStatus");
  if(!status)return;
  status.classList.remove("saving","saved","error");
  status.classList.add(state);
  if(state==="saving")status.textContent="Saving…";
  else if(state==="saved")status.textContent="✓ Saved";
  else status.textContent="Save failed";
}
function scheduleSavedStatus(){
  clearTimeout(saveStatusTimer);
  saveStatusTimer=setTimeout(()=>setSaveStatus("saved"),220);
}
function persist(){
  try{
    localStorage.setItem(STORAGE_KEY,JSON.stringify(notes));
    localStorage.setItem(CATEGORIES_KEY,JSON.stringify(categories));
    return true;
  }catch(e){
    showToast("Unable to save. Device storage may be full.");
    return false;
  }
}
function currentNote(){return notes.find(n=>n.id===currentNoteId)||null}
function plainText(html){
  const box=document.createElement("div");box.innerHTML=html||"";
  return (box.innerText||box.textContent||"").replace(/\s+/g," ").trim();
}
function esc(s){
  return String(s).replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}
function escapeRegExp(s){
  return String(s).replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
}
function highlightSearchTerms(text,query){
  const value=String(text||"");
  const terms=[...new Set(String(query||"").trim().split(/\s+/).filter(Boolean))]
    .sort((a,b)=>b.length-a.length);
  if(!terms.length)return esc(value);
  const regex=new RegExp("("+terms.map(escapeRegExp).join("|")+")","gi");
  return value.split(regex).map(part=>{
    const matched=terms.some(term=>part.toLowerCase()===term.toLowerCase());
    return matched?'<mark class="search-match">'+esc(part)+'</mark>':esc(part);
  }).join("");
}
function showToast(msg){
  $("toast").textContent=msg;$("toast").classList.remove("hidden");
  clearTimeout(toastTimer);

function attachCategoryDrag(button,surface){
  const isTabs=surface==="tabs";
  const container=isTabs?$("categoryTabs"):$("drawerCategories");
  const selector=isTabs?".category-tab[data-category]":".drawer-category[data-category]";
  const axis=isTabs?"x":"y";
  button.addEventListener("pointerdown",e=>{
    if(e.button!==0&&e.pointerType==="mouse")return;
    if(button.dataset.category==="All Notes")return;
    if(!isTabs&&!e.target.closest(".cat-drag-handle"))return;
    dragInfo={button,container,selector,axis,surface,pointerId:e.pointerId,startX:e.clientX,startY:e.clientY,moved:false};
    try{button.setPointerCapture(e.pointerId)}catch(err){}
  });
  button.addEventListener("pointermove",e=>{
    if(!dragInfo||dragInfo.button!==button||dragInfo.pointerId!==e.pointerId)return;
    const dx=e.clientX-dragInfo.startX,dy=e.clientY-dragInfo.startY;
    const primary=axis==="x"?dx:dy,secondary=axis==="x"?dy:dx;
    if(!dragInfo.moved){
      if(Math.abs(primary)<8)return;
      if(Math.abs(primary)<Math.abs(secondary))return;
      dragInfo.moved=true;button.classList.add("dragging");
    }
    if(e.cancelable)e.preventDefault();
    const underPointer=document.elementFromPoint(e.clientX,e.clientY);
    const target=underPointer?underPointer.closest(selector):null;
    if(!target||target===button||target.dataset.category==="All Notes"||target.parentElement!==container)return;
    container.querySelectorAll(".drag-target").forEach(el=>el.classList.remove("drag-target"));
    target.classList.add("drag-target");
    const rect=target.getBoundingClientRect();
    const before=axis==="x"?e.clientX<rect.left+rect.width/2:e.clientY<rect.top+rect.height/2;
    if(before){if(button.nextElementSibling!==target)container.insertBefore(button,target)}
    else if(target.nextElementSibling!==button)container.insertBefore(button,target.nextElementSibling);
  });
  const finish=e=>{
    if(!dragInfo||dragInfo.button!==button||dragInfo.pointerId!==e.pointerId)return;
    const moved=dragInfo.moved;
    button.classList.remove("dragging");
    container.querySelectorAll(".drag-target").forEach(el=>el.classList.remove("drag-target"));
    if(moved){
      const reordered=[...container.querySelectorAll(selector)].map(el=>el.dataset.category).filter(cat=>cat&&cat!=="All Notes");
      const remaining=categories.filter(cat=>cat!=="All Notes"&&!reordered.includes(cat));
      categories=["All Notes",...reordered,...remaining];
      persist();suppressCategoryClick=true;renderCategories();renderNotes();
      showToast("Category order saved");
      setTimeout(()=>{suppressCategoryClick=false},350);
    }
    dragInfo=null;
  };
  button.addEventListener("pointerup",finish);
  button.addEventListener("pointercancel",finish);
  button.addEventListener("lostpointercapture",e=>{
    if(dragInfo&&dragInfo.button===button&&dragInfo.pointerId===e.pointerId)finish(e);
  });
}

function getRangeAtPoint(e){
  if(document.caretRangeFromPoint)return document.caretRangeFromPoint(e.clientX,e.clientY);
  if(document.caretPositionFromPoint){
    const p=document.caretPositionFromPoint(e.clientX,e.clientY);
    if(p){const r=document.createRange();r.setStart(p.offsetNode,p.offset);r.collapse(true);return r}
  }
  return null;
}
function isWordChar(c){return !!c&&/[\p{L}\p{N}_'-]/u.test(c)}
function markWordAtPoint(e){
  if(isEditMode||e.target.closest("button,input,a,select,textarea"))return;
  const r=getRangeAtPoint(e);
  if(!r||r.startContainer.nodeType!==Node.TEXT_NODE)return;
  const node=r.startContainer,text=node.textContent||"";
  if(!text.length)return;
  let start=Math.min(r.startOffset,text.length-1);
  if(!isWordChar(text[start])&&start>0&&isWordChar(text[start-1]))start--;
  if(!isWordChar(text[start]))return;
  let end=start;
  while(start>0&&isWordChar(text[start-1]))start--;
  while(end<text.length&&isWordChar(text[end]))end++;
  clearReadMarker();
  try{
    const wr=document.createRange();wr.setStart(node,start);wr.setEnd(node,end);
    const span=document.createElement("span");span.className="read-word-marker";
    wr.surroundContents(span);markerSpan=span;
  }catch(err){}
}

/* AUTO-SCROLL FIX */
let typingScrollFrame=0;
let typingScrollFrame2=0;
let pasteScrollPending=false;
let pasteScrollToken=0;

function updateNoteBottomSpace(){
  if(!noteBody||!toolbar)return;
  const viewportHeight=vv?vv.height:window.innerHeight;
  const toolbarHeight=toolbar.classList.contains("hidden")?0:toolbar.getBoundingClientRect().height;
  const extraSpace=Math.max(120,viewportHeight-toolbarHeight);
  noteBody.style.paddingBottom=`calc(${Math.ceil(extraSpace)}px + env(safe-area-inset-bottom))`;
}
function getVisibleTypingArea(){
  const bodyRect=noteBody.getBoundingClientRect();
  const viewportTop=vv?vv.offsetTop:0;
  const viewportBottom=vv?vv.offsetTop+vv.height:window.innerHeight;
  const toolbarTop=toolbar.classList.contains("hidden")?viewportBottom:toolbar.getBoundingClientRect().top;
  const visibleTop=Math.max(bodyRect.top,viewportTop)+8;
  const visibleBottom=Math.min(bodyRect.bottom,toolbarTop,viewportBottom)-8;
  if(visibleBottom<=visibleTop)return null;
  return{visibleTop,visibleBottom,targetY:visibleTop+(visibleBottom-visibleTop)*0.65};
}
function getTypingCaretRect(){
  const selection=window.getSelection();
  if(!selection||!selection.rangeCount)return null;
  const range=selection.getRangeAt(0);
  if(!range.collapsed)return null;
  if(!noteBody.contains(range.startContainer))return null;
  const caretRect=range.getBoundingClientRect();
  if(caretRect.height>0)return caretRect;
  const node=range.startContainer;
  if(node.nodeType===Node.TEXT_NODE&&node.textContent.length){
    const length=node.textContent.length;
    const offset=Math.max(0,Math.min(range.startOffset,length-1));
    const probe=document.createRange();
    probe.setStart(node,offset);probe.setEnd(node,Math.min(offset+1,length));
    const rects=probe.getClientRects();
    if(rects.length){
      const r=rects[rects.length-1];
      return{top:r.top,bottom:r.bottom,height:r.height,left:r.left,right:r.right,width:r.width};
    }
  }
  if(node.nodeType===Node.ELEMENT_NODE&&range.startOffset>0){
    const previous=node.childNodes[range.startOffset-1];
    if(previous){
      const probe=document.createRange();
      try{
        if(previous.nodeType===Node.TEXT_NODE&&previous.length){
          probe.setStart(previous,previous.length-1);probe.setEnd(previous,previous.length);
        }else{probe.selectNodeContents(previous);probe.collapse(false)}
        const r=probe.getBoundingClientRect();
        if(r.height>0)return r;
      }catch(e){}
    }
  }
  return null;
}
function keepTypingLineVisible(){
  if(pasteScrollPending||!isEditMode||editor.classList.contains("hidden")||document.activeElement!==noteBody)return;
  const caret=getTypingCaretRect(),area=getVisibleTypingArea();
  if(!caret||!area)return;
  if(caret.bottom>area.visibleBottom-2){noteBody.scrollTop+=caret.bottom-(area.visibleBottom-2);return}
  if(caret.top<area.visibleTop)noteBody.scrollTop-=area.visibleTop-caret.top;
}
function scheduleTypingScroll(){
  if(pasteScrollPending)return;
  if(typingScrollFrame){cancelAnimationFrame(typingScrollFrame);typingScrollFrame=0}
  if(typingScrollFrame2){cancelAnimationFrame(typingScrollFrame2);typingScrollFrame2=0}
  typingScrollFrame=requestAnimationFrame(()=>{
    typingScrollFrame=0;
    typingScrollFrame2=requestAnimationFrame(()=>{
      typingScrollFrame2=0;keepTypingLineVisible();
    });
  });
}
function keepPastedTailAtTarget(){
  if(!isEditMode||editor.classList.contains("hidden")||document.activeElement!==noteBody)return false;
  const caret=getTypingCaretRect(),area=getVisibleTypingArea();
  if(!caret||!area)return false;
  const difference=caret.bottom-area.targetY;
  if(Math.abs(difference)>1)noteBody.scrollTop+=difference;
  return true;
}
function schedulePasteTailScroll(){
  pasteScrollPending=true;
  const token=++pasteScrollToken;
  setTimeout(()=>{
    if(token!==pasteScrollToken)return;
    updateToolbarPosition();updateNoteBottomSpace();
    let attempts=0;
    function positionPastedTail(){
      if(token!==pasteScrollToken)return;
      updateToolbarPosition();updateNoteBottomSpace();
      const positioned=keepPastedTailAtTarget();
      if(positioned||attempts>=8){
        pasteScrollPending=false;scheduleTypingScroll();return;
      }
      attempts++;requestAnimationFrame(positionPastedTail);
    }
    requestAnimationFrame(()=>requestAnimationFrame(positionPastedTail));
  },0);
}

/* Each listener is registered only once. */
noteBody.addEventListener("paste",schedulePasteTailScroll);
noteBody.addEventListener("input",scheduleTypingScroll);
noteBody.addEventListener("keyup",scheduleTypingScroll);

  vv.addEventListener("resize",()=>{
    updateToolbarPosition();updateNoteBottomSpace();scheduleTypingScroll();

  });
}

$("btnFontMinus").addEventListener("click",()=>changeFontSize(-1));
$("btnFontPlus").addEventListener("click",()=>changeFontSize(1));
$("paletteClose").addEventListener("click",closePalette);
noteBody.addEventListener("keyup",saveSelection);
noteBody.addEventListener("mouseup",saveSelection);
noteBody.addEventListener("input",()=>{if(isEditMode)saveCurrentNote()});
noteTitle.addEventListener("input",()=>{if(isEditMode)saveCurrentNote()});

$("btnNewNote").addEventListener("click",newNote);
$("btnBack").addEventListener("click",closeEditor);
$("btnCopy").addEventListener("click",copyCurrentNote);
$("btnMenu").addEventListener("click",e=>{
  e.stopPropagation();const n=currentNote();
  if(n){
    $("menuFavorite").textContent=n.favorite?"★ Remove Favorite":"☆ Favorite";
    updatePinMenu();
  }
  menu.classList.toggle("hidden");
});
document.addEventListener("click",e=>{
  if(menu.classList.contains("hidden"))return;
  if(!menu.contains(e.target)&&!e.target.closest("#btnMenu"))menu.classList.add("hidden");
});
$("menuMode").addEventListener("click",()=>setMode(!isEditMode));
$("menuMove").addEventListener("click",()=>{menu.classList.add("hidden");moveCategoryDialog()});
$("menuPin").addEventListener("click",()=>{const n=currentNote();if(n){togglePin(n.id);menu.classList.add("hidden")}});
$("menuFavorite").addEventListener("click",toggleFavorite);
$("menuDelete").addEventListener("click",deleteCurrentNote);

$("btnDrawer").addEventListener("click",openDrawer);
$("drawerBackdrop").addEventListener("click",e=>{if(e.target===$("drawerBackdrop"))closeDrawer()});
$("drawerHome").addEventListener("click",()=>{
  activeCategory="All Notes";favoritesOnly=false;$("searchInput").value="";
  renderCategories();renderNotes();closeDrawer();
});
$("drawerFavorites").addEventListener("click",showFavorites);
$("drawerNewCategory").addEventListener("click",()=>{closeDrawer();addCategoryDialog()});
$("drawerNewNote").addEventListener("click",()=>{closeDrawer();newNote()});
$("drawerExport").addEventListener("click",exportNotes);
$("btnFavorites").addEventListener("click",showFavorites);
$("searchInput").addEventListener("input",renderNotes);
$("dialogCancel").addEventListener("click",closeDialog);
$("dialogBackdrop").addEventListener("click",e=>{if(e.target===$("dialogBackdrop"))closeDialog()});
$("dialogConfirm").addEventListener("click",()=>{
  if(typeof dialogAction==="function"){
    const result=dialogAction();
    if(result!==false)closeDialog();
  }
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){
    if(!$("dialogBackdrop").classList.contains("hidden"))closeDialog();
    else if(!$("drawerBackdrop").classList.contains("hidden"))closeDrawer();
    else if(!menu.classList.contains("hidden"))menu.classList.add("hidden");
    else if(!editor.classList.contains("hidden"))closeEditor();
  }
  if(e.key==="Enter"&&e.target.id==="dialogCategoryName"){
    e.preventDefault();$("dialogConfirm").click();
  }
});

/* PHONE BACK BUTTON / ANDROID BACK GESTURE */
let lastHomeBackTime=0;
let backExitTimer=null;
let allowNativeBack=false;
let backActionInProgress=false;

function addBackGuard(){
  try{history.pushState({preachMateGuard:true},"",location.href)}catch(e){}
}
function handleAppBack(){
  if(!$("dialogBackdrop").classList.contains("hidden")){closeDialog();return}
  if(!$("drawerBackdrop").classList.contains("hidden")){closeDrawer();return}
  if(palette&&!palette.classList.contains("hidden")){closePalette();return}
  if(!menu.classList.contains("hidden")){menu.classList.add("hidden");return}
  if(!editor.classList.contains("hidden")){
    saveCurrentNote();closeEditor();
    lastHomeBackTime=0;clearTimeout(backExitTimer);return;
  }
  const now=Date.now();
  if(lastHomeBackTime!==0&&now-lastHomeBackTime<=2000){
    lastHomeBackTime=0;clearTimeout(backExitTimer);
    allowNativeBack=true;backActionInProgress=true;
    setTimeout(()=>{backActionInProgress=false},300);
    return;
  }
  lastHomeBackTime=now;
  showToast("Press back again to exit");
  clearTimeout(backExitTimer);
  backExitTimer=setTimeout(()=>{lastHomeBackTime=0},2000);
}
try{
  history.replaceState({preachMateBase:true},"",location.href);
  addBackGuard();
}catch(e){}
window.addEventListener("popstate",()=>{
  if(allowNativeBack){allowNativeBack=false;return}
  if(backActionInProgress)return;
  handleAppBack();
  if(!allowNativeBack)setTimeout(()=>{if(!allowNativeBack)addBackGuard()},0);
});
window.addEventListener("resize",()=>{
  updateToolbarPosition();updateNoteBottomSpace();scheduleTypingScroll();
});
window.addEventListener("pagehide",()=>{
  if(currentNoteId)saveCurrentNote();
});
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="hidden"&&currentNoteId)saveCurrentNote();
});

persist();
renderCategories();
renderNotes();

})();
</script>
